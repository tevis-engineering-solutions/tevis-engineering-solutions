<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TES favicon">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1830"/>
    </linearGradient>
    <linearGradient id="ft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" ry="6" fill="url(#fg)"/>
  <!-- Simplified corner traces for favicon legibility -->
  <g fill="none" stroke="url(#ft)" stroke-width="0.9" stroke-linecap="round" opacity="0.8">
    <line x1="2" y1="4" x2="7" y2="4"/>
    <line x1="7" y1="4" x2="7" y2="8"/>
    <line x1="30" y1="28" x2="25" y2="28"/>
    <line x1="25" y1="28" x2="25" y2="24"/>
  </g>
  <g fill="url(#ft)" opacity="0.9">
    <circle cx="2" cy="4" r="1"/>
    <circle cx="7" cy="4" r="0.9"/>
    <circle cx="7" cy="8" r="0.9"/>
    <circle cx="30" cy="28" r="1"/>
    <circle cx="25" cy="28" r="0.9"/>
    <circle cx="25" cy="24" r="0.9"/>
  </g>
  <!-- Star node at top center -->
  <g transform="translate(16,4.5)" opacity="0.8">
    <polygon points="0,-2.2 0.65,-0.9 2.1,-0.68 1.05,0.34 1.29,1.78 0,1.08 -1.29,1.78 -1.05,0.34 -2.1,-0.68 -0.65,-0.9" fill="url(#ft)"/>
  </g>
  <!-- TES text — simplified for small size -->
  <text x="16" y="22"
    font-family="'Montserrat', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="10"
    letter-spacing="0.8"
    text-anchor="middle"
    fill="#ffffff">TES</text>
  <line x1="5" y1="24.5" x2="27" y2="24.5" stroke="url(#ft)" stroke-width="0.7" opacity="0.55"/>
</svg>
