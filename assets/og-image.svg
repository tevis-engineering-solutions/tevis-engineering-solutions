<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07101f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1e35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fa2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64f0d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fa2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64f0d2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="45%">
      <stop offset="0%" style="stop-color:#4fa2ff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#4fa2ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#64f0d2;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#64f0d2;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Decorative grid lines -->
  <g stroke="#4fa2ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="72" y="170" width="5" height="290" rx="3" fill="url(#accentGrad)" />

  <!-- TES logo mark -->
  <rect x="95" y="175" width="76" height="76" rx="14" fill="url(#logoGrad)" />
  <text x="133" y="229" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="36" fill="#07101f" text-anchor="middle" dominant-baseline="auto">TES</text>

  <!-- Main headline -->
  <text x="200" y="241" font-family="Arial, sans-serif" font-weight="800"
        font-size="62" fill="#e8efff" letter-spacing="-1">Tevis Engineering</text>
  <text x="200" y="311" font-family="Arial, sans-serif" font-weight="800"
        font-size="62" fill="#e8efff" letter-spacing="-1">Solutions</text>

  <!-- Gradient underline -->
  <rect x="200" y="326" width="520" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Tagline -->
  <text x="200" y="382" font-family="Arial, sans-serif" font-weight="400"
        font-size="30" fill="#b4c3dd" letter-spacing="0.5">Cleveland IT Support &amp; Engineering</text>
  <text x="200" y="422" font-family="Arial, sans-serif" font-weight="400"
        font-size="26" fill="#7a96bc" letter-spacing="0.5">Veteran-Owned · MSP · PCB Design · CAD · Web</text>

  <!-- Right side decorative element: circuit node -->
  <g transform="translate(960, 315)" opacity="0.22">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4fa2ff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#64f0d2" stroke-width="1"/>
    <circle cx="0" cy="0" r="12" fill="#4fa2ff"/>
    <line x1="0" y1="-80" x2="0" y2="-120" stroke="#4fa2ff" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="120" y2="0" stroke="#4fa2ff" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="0" y2="120" stroke="#64f0d2" stroke-width="1.5"/>
    <line x1="-80" y1="0" x2="-120" y2="0" stroke="#64f0d2" stroke-width="1.5"/>
    <circle cx="0" cy="-120" r="6" fill="#4fa2ff"/>
    <circle cx="120" cy="0" r="6" fill="#4fa2ff"/>
    <circle cx="0" cy="120" r="6" fill="#64f0d2"/>
    <circle cx="-120" cy="0" r="6" fill="#64f0d2"/>
  </g>

  <!-- Bottom URL bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#0a1624" fill-opacity="0.8"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-weight="500"
        font-size="22" fill="#4fa2ff" text-anchor="middle" letter-spacing="1">tevisengineering.com</text>
</svg>
