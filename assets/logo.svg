<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Tevis Engineering Solutions">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1830"/>
    </linearGradient>
    <linearGradient id="ltrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
    <linearGradient id="ltext" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d8eeff"/>
    </linearGradient>
    <linearGradient id="wmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#5ea5ff"/>
    </linearGradient>
  </defs>

  <!-- Logo mark — 64×64 icon -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#lbg)"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="url(#ltrace)" stroke-width="1" stroke-linecap="round" opacity="0.85">
    <line x1="4" y1="8" x2="14" y2="8"/>
    <line x1="14" y1="8" x2="14" y2="14"/>
    <line x1="4" y1="8" x2="4" y2="20"/>
    <line x1="4" y1="20" x2="8" y2="20"/>
    <line x1="60" y1="56" x2="52" y2="56"/>
    <line x1="52" y1="56" x2="52" y2="50"/>
    <line x1="60" y1="56" x2="60" y2="44"/>
    <line x1="60" y1="44" x2="56" y2="44"/>
    <line x1="50" y1="4" x2="60" y2="4"/>
    <line x1="60" y1="4" x2="60" y2="14"/>
    <line x1="4" y1="50" x2="4" y2="60"/>
    <line x1="4" y1="60" x2="14" y2="60"/>
  </g>
  <g fill="url(#ltrace)" opacity="0.9">
    <circle cx="4" cy="8" r="1.8"/>
    <circle cx="14" cy="8" r="1.5"/>
    <circle cx="14" cy="14" r="1.5"/>
    <circle cx="4" cy="20" r="1.5"/>
    <circle cx="8" cy="20" r="1.5"/>
    <circle cx="60" cy="56" r="1.8"/>
    <circle cx="52" cy="56" r="1.5"/>
    <circle cx="52" cy="50" r="1.5"/>
    <circle cx="60" cy="44" r="1.5"/>
    <circle cx="56" cy="44" r="1.5"/>
    <circle cx="60" cy="4" r="1.8"/>
    <circle cx="50" cy="4" r="1.5"/>
    <circle cx="60" cy="14" r="1.5"/>
    <circle cx="4" cy="50" r="1.5"/>
    <circle cx="4" cy="60" r="1.5"/>
    <circle cx="14" cy="60" r="1.5"/>
  </g>

  <!-- Star node -->
  <g transform="translate(32,7)" opacity="0.85">
    <polygon points="0,-4 1.18,-1.62 3.8,-1.24 1.9,0.62 2.35,3.24 0,1.97 -2.35,3.24 -1.9,0.62 -3.8,-1.24 -1.18,-1.62" fill="url(#ltrace)"/>
  </g>
  <line x1="28.2" y1="7" x2="20" y2="7" stroke="url(#ltrace)" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <line x1="35.8" y1="7" x2="44" y2="7" stroke="url(#ltrace)" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <circle cx="20" cy="7" r="1.5" fill="url(#ltrace)" opacity="0.8"/>
  <circle cx="44" cy="7" r="1.5" fill="url(#ltrace)" opacity="0.8"/>

  <!-- TES monogram -->
  <text x="32" y="43"
    font-family="'Montserrat', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="19"
    letter-spacing="1.5"
    text-anchor="middle"
    fill="url(#ltext)">TES</text>
  <line x1="12" y1="47" x2="52" y2="47" stroke="url(#ltrace)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Wordmark — two-line lockup to the right of the mark, vertically centered in 64px height -->
  <!-- "TEVIS ENGINEERING" line 1 -->
  <text x="78" y="28"
    font-family="'Montserrat', 'Arial Black', sans-serif"
    font-weight="800"
    font-size="15.5"
    letter-spacing="1.8"
    fill="url(#ltext)"
    text-anchor="start">TEVIS ENGINEERING</text>

  <!-- "SOLUTIONS" line 2 — slightly smaller, lighter color -->
  <text x="78" y="48"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-weight="500"
    font-size="11.5"
    letter-spacing="3.5"
    fill="url(#wmark)"
    text-anchor="start">SOLUTIONS</text>

  <!-- Vertical separator line between mark and wordmark -->
  <line x1="72" y1="10" x2="72" y2="54" stroke="url(#ltrace)" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>
</svg>
